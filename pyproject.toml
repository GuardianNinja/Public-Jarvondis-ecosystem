[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvondis-core"
version = "4.0.0"
description = "Digital University Autonomous Companion — Core Engine"
authors = [{name="Leif William Sogge"}]
readme = "README.md"
requires-python = ">=3.9"

[project.optional-dependencies]
llm = ["openai"]

[tool.setuptools.packages.find]
include = ["jarvondis_core"]
